# cargo-deny configuration (TOFIX175 step 2): advisories, licences, duplicate
# versions and crate sources are checked on every CI run.
# https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
# Advisories we accept for now go here with a reason and a ticket, e.g.
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
version = 2
# Permissive licences only; anything else fails the build until reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",   # webpki-roots: Mozilla root certificate data
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
