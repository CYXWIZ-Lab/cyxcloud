[package]
name = "cyxcloud-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CyxCloud storage node daemon"

[[bin]]
name = "cyxcloud-node"
path = "src/main.rs"

[lib]
name = "cyxcloud_node"
path = "src/lib.rs"

[dependencies]
cyxcloud-core = { path = "../cyxcloud-core" }
cyxcloud-storage = { path = "../cyxcloud-storage" }
cyxcloud-network = { path = "../cyxcloud-network" }
cyxcloud-protocol = { path = "../cyxcloud-protocol" }

# Async
tokio = { workspace = true }
futures = { workspace = true }

# Configuration
serde = { workspace = true }
toml = { workspace = true }

# CLI
clap = { workspace = true }

# gRPC
tonic = { workspace = true }

# TLS (rustls 0.23+ requires explicit crypto provider)
rustls = { workspace = true }

# HTTP server for metrics
axum = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
hostname = "0.3"
hex = "0.4"
blake3 = "1.5"

# System metrics
sysinfo = "0.31"

# HTTP client for cyxwiz-api
reqwest = { workspace = true }
serde_json = "1"
rpassword = "7"
dirs = "5.0"

# TTY detection for non-interactive mode
atty = "0.2"

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
