[workspace]
resolver = "2"
members = [
    "cyxcloud-core",
    "cyxcloud-storage",
    "cyxcloud-network",
    "cyxcloud-metadata",
    "cyxcloud-node",
    "cyxcloud-gateway",
    "cyxcloud-rebalancer",
    "cyxcloud-cli",
    "cyxcloud-protocol",
    "cyxwiz-front",
]

# Lints for every member ([lints] workspace = true in each crate).
[workspace.lints.clippy]
# async_trait (and tonic) put #[must_use] on functions that return boxed
# futures; newer clippy flags that in code we do not write.
double_must_use = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cyxwiz/cyxcloud"
rust-version = "1.94"

[workspace.dependencies]
# ===== Erasure Coding =====
reed-solomon-erasure = { version = "6.0", features = ["simd-accel"] }

# ===== Networking =====
# One TLS provider everywhere: ring (rustls, tokio-rustls, tonic).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"

# ===== Storage Backend =====
rocksdb = { version = "0.22", features = ["multi-threaded-cf"] }
sled = "0.34"

# ===== Async Runtime =====
tokio = { version = "1.35", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-stream = "0.1"
futures = "0.3"

# ===== Cryptography =====
blake3 = { version = "1.5", features = ["rayon", "mmap"] }
aes-gcm = "0.10"
argon2 = "0.5"
ring = "0.17"

# ===== Serialization =====
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# HTTP client: rustls on the ring provider the rest of the workspace uses
# (reqwest's own default would add aws-lc-rs as a second provider).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "json"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# ===== Database & Caching =====
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }
redis = { version = "1.8", features = ["tokio-comp", "cluster"] }

# ===== Observability =====
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
opentelemetry = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = "0.14"
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# ===== Performance =====
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"
memmap2 = "0.9"

# ===== Utilities =====
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
bytes = { version = "1.5", features = ["serde"] }
rand = "0.8"
base64 = "0.21"
bs58 = "0.5"
jsonwebtoken = "9.2"
# ed25519-dalek: node identity keys (cyxcloud-core node_identity)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# ===== HTTP/API =====
axum = { version = "0.7", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
hyper = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# ===== Testing =====
criterion = "0.5"
proptest = "1.4"
mockall = "0.12"
tempfile = "3.8"

[workspace.metadata.features]
io-uring = ["cyxcloud-storage/io-uring", "cyxcloud-node/io-uring"]
fips = ["cyxcloud-core/fips"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Low-memory profile for CI/CD platforms like Railway (512MB limit)
[profile.release-railway]
inherits = "release"
lto = "thin"           # Much less memory than "fat"
codegen-units = 16     # Parallel codegen uses less peak memory
opt-level = "z"        # Optimize for size

[profile.bench]
inherits = "release"
debug = true
