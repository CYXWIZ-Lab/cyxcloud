[package]
name = "cyxcloud-network"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node-to-node chunk transfer for CyxCloud over gRPC"

[dependencies]
cyxcloud-core = { path = "../cyxcloud-core" }
cyxcloud-storage = { path = "../cyxcloud-storage" }
cyxcloud-protocol = { path = "../cyxcloud-protocol" }

# gRPC for data transfer
tonic = { workspace = true }

# TLS
rustls = { workspace = true }

# Async
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
bincode = { workspace = true }
prost = { workspace = true }

# Utilities
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "cluster_node"
path = "examples/cluster_node.rs"

[lints]
workspace = true
